[settings]
auto_install = false
exec_auto_install = false
experimental = true
fetch_remote_versions_timeout = "60s"
http_timeout = "60s"
lockfile = true
locked_verify_provenance = true
not_found_auto_install = false
use_versions_host = false
minimum_release_age = "0s"

[settings.python]
compile = false

[settings.task]
run_auto_install = false

[settings.self_update]
minimum_release_age = "0s"

[env]
# Temporary: Bun in claude misses VPN split-DNS names on macOS, https://github.com/oven-sh/bun/issues/44075
BUN_FEATURE_FLAG_DISABLE_DNS_CACHE_LIBINFO = "1"

[tools]
1password-cli = "latest"
age = "latest"
amazon-ecr-credential-helper = "latest"
argocd = "latest"
awscli = { version = "latest", symlink_bins = "true" }
claude = "latest"
dua = "latest"
fnox = "latest"
gdu = "latest"
gh = "latest"
gitleaks = "latest"
gitui = "latest"
go = "latest"
golangci-lint = "latest"
groovy = "latest"
helm = "latest"
hk = "latest"
hyperfine = "latest"
java = "corretto-17"
k9s = "latest"
kafkactl = "latest"
kubeconform = "latest"
kubectl = "latest"
maven = "latest"
mongosh = "latest"
node = "26"
pkl = "latest"
pre-commit = "latest"
python = "3.14"
ruff = "latest"
terraform = "latest"
terraform-docs = "latest"
terragrunt = "latest"
tflint = "latest"
usage = "latest"
uv = "latest"
yamllint = "latest"
zoxide = "latest"

[tools."http:kafka"]
version = "3.9.2"
url = "https://archive.apache.org/dist/kafka/{{ version }}/kafka_2.13-{{ version }}.tgz"
checksum_url = "https://archive.apache.org/dist/kafka/{{ version }}/kafka_2.13-{{ version }}.tgz.sha512"
checksum_expr = '"sha512:" + lower(replace(replace(replace(split(body, ":")[1], " ", ""), "\n", ""), "\r", ""))'
version_list_url = "https://archive.apache.org/dist/kafka/"
version_regex = 'href="([0-9]+\.[0-9]+\.[0-9]+)/"'
version_order = "semver"
strip_components = 1
bin_path = "bin"

[tools."http:aws-msk-iam-auth"]
version = "2.3.9"
url = "https://github.com/aws/aws-msk-iam-auth/releases/download/v{{ version }}/aws-msk-iam-auth-{{ version }}-all.jar"
checksum_url = "https://github.com/aws/aws-msk-iam-auth/releases/download/v{{ version }}/aws-msk-iam-auth-{{ version }}-all.jar.sha256"
version_list_url = "https://api.github.com/repos/aws/aws-msk-iam-auth/releases"
version_expr = 'fromJSON(body) | map({ trimPrefix(#.tag_name, "v") })'
version_order = "semver"

[tools."http:kafkactl-aws-plugin"]
version = "1.3.1"
bin_path = "."
url = 'https://github.com/deviceinsight/kafkactl-plugins/releases/download/v{{ version }}/kafkactl-aws-plugin_{{ version }}_{{ os(macos="darwin") }}_{{ arch(x64="amd64") }}.tar.gz'
checksum_url = "https://github.com/deviceinsight/kafkactl-plugins/releases/download/v{{ version }}/kafkactl-aws-plugin_{{ version }}_checksums.txt"
version_list_url = "https://api.github.com/repos/deviceinsight/kafkactl-plugins/releases"
version_expr = 'fromJSON(body) | map({ trimPrefix(#.tag_name, "v") })'
version_order = "semver"

[tools."http:kafkactl-aws-plugin".platforms]
windows-x64 = { url = "https://github.com/deviceinsight/kafkactl-plugins/releases/download/v{{ version }}/kafkactl-aws-plugin_{{ version }}_windows_amd64.zip" }

[tools."github:mongodb/mongodb-atlas-cli"]
version = "latest"
version_prefix = "atlascli/v"

[tools."http:mongodb-database-tools"]
version = "latest"
url = 'https://fastdl.mongodb.org/tools/db/mongodb-database-tools-{{ os(linux="ubuntu2404") }}-{{ arch(x64="x86_64") }}-{{ version }}.{{ os(macos="zip", linux="tgz", windows="zip") }}'
checksum_url = "https://downloads.mongodb.org/tools/db/release.json"
checksum_expr = '"sha256:" + filter(flatten(map(fromJSON(body).versions, { #.downloads })), { #.archive.url == url })[0].archive.sha256'
version_list_url = "https://downloads.mongodb.org/tools/db/release.json"
version_expr = 'map(fromJSON(body).versions, { #.version })'
version_order = "semver"
strip_components = 1
bin_path = "bin"

[tools."http:terraform-mcp-server"]
version = "1.3.0"
url = 'https://releases.hashicorp.com/terraform-mcp-server/{{ version }}/terraform-mcp-server_{{ version }}_{{ os(macos="darwin") }}_{{ arch(x64="amd64") }}.zip'
checksum_url = "https://releases.hashicorp.com/terraform-mcp-server/{{ version }}/terraform-mcp-server_{{ version }}_SHA256SUMS"
version_list_url = "https://releases.hashicorp.com/terraform-mcp-server/index.json"
version_expr = "keys(fromJSON(body).versions)"
version_order = "semver"
bin_path = "."
